<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MRLN · Team Room</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1322; --line:#1b2740; --txt:#cdd9f0; --dim:#6c7b9c;
    --akashi:#ff4d6d; --mikoto:#36d6ff; --hugo:#3bf0a0; --osefe:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#10203a 0%,var(--bg) 60%);
    color:var(--txt); font:15px/1.5 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
  }
  header{
    padding:14px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; background:rgba(7,11,20,.85);
    backdrop-filter:blur(8px); position:sticky; top:0; z-index:5;
  }
  .logo{width:26px;height:26px;flex:0 0 auto;transform:rotate(45deg);
    background:linear-gradient(135deg,#36d6ff,#6c5cff);border-radius:6px;
    box-shadow:0 0 18px #36d6ff66}
  h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:700}
  .sub{font-size:11px;color:var(--dim);margin-top:1px}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--hugo);
    box-shadow:0 0 0 0 var(--hugo);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #3bf0a088}70%{box-shadow:0 0 0 9px #3bf0a000}100%{box-shadow:0 0 0 0 #3bf0a000}}

  .gate{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
  .gate b{font-size:11px;color:var(--dim);letter-spacing:.6px;margin-right:2px}
  .chip{padding:4px 9px;border-radius:999px;border:1px solid var(--line);
    color:var(--dim);font-size:11px;font-weight:600;display:flex;gap:5px;align-items:center}
  .chip.ok{border-color:transparent}
  .chip.ok.akashi{background:#ff4d6d22;color:var(--akashi)}
  .chip.ok.mikoto{background:#36d6ff22;color:var(--mikoto)}
  .chip.ok.hugo{background:#3bf0a022;color:var(--hugo)}

  #feed{flex:1;overflow-y:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .who{font-size:11px;font-weight:700;margin:0 0 3px 4px;letter-spacing:.3px}
  .bubble{padding:9px 13px;border-radius:14px;background:var(--panel);
    border:1px solid var(--line);position:relative}
  .when{font-size:10px;color:var(--dim);margin-top:4px}
  .akashi .who{color:var(--akashi)} .akashi .bubble{border-left:3px solid var(--akashi)}
  .mikoto .who{color:var(--mikoto)} .mikoto .bubble{border-left:3px solid var(--mikoto)}
  .hugo .who{color:var(--hugo)} .hugo .bubble{border-left:3px solid var(--hugo)}
  .osefe{align-self:flex-end;text-align:right}
  .osefe .who{color:var(--osefe);margin:0 4px 3px 0}
  .osefe .bubble{background:#1a2238;border:1px solid #2a3a5e;border-right:3px solid var(--osefe);border-left:none}
  .sys{align-self:center;color:var(--dim);font-size:11px;text-align:center;max-width:80%}
  .err{align-self:center;color:var(--akashi);font-size:12px;text-align:center}
  footer{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);
    display:flex;justify-content:space-between;background:rgba(7,11,20,.85)}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>MRLN · Team Room</h1>
    <div class="sub">Akashi · Mikoto · Hugo — led by Osefe</div>
  </div>
  <div class="live"><span class="dot"></span><span id="liveTxt">live</span></div>
</header>

<div class="gate">
  <b>PUBLISH GATE</b>
  <span class="chip" id="c-akashi">Akashi · SAFE</span>
  <span class="chip" id="c-mikoto">Mikoto · MISSING 0</span>
  <span class="chip" id="c-hugo">Hugo · GREEN</span>
</div>

<div id="feed"><div class="sys">connecting to the room…</div></div>

<footer>
  <span id="status">—</span>
  <span id="count"></span>
</footer>

<script>
/* Watch-only window onto TEAM-CHAT.md. Polls the raw file from GitHub every few
   seconds and renders the MESSAGES list as a live chat thread. Read-only. */
var OWNER='sagemrln', REPO='my-first-repo', BRANCH='claude/vibrant-pasteur-ie24ab';
var RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/TEAM-CHAT.md';
var POLL=5000;            // refresh every 5s
var feed=document.getElementById('feed'), lastHash='';

function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmt(s){ // tiny inline markdown: **bold** and `code`
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
}
function who(name){
  var n=name.toLowerCase();
  if(n.indexOf('akashi')>=0)return'akashi';
  if(n.indexOf('mikoto')>=0)return'mikoto';
  if(n.indexOf('hugo')>=0)return'hugo';
  if(n.indexOf('osefe')>=0)return'osefe';
  return'sys';
}
function parse(md){
  // grab the MESSAGES section
  var i=md.indexOf('## MESSAGES');
  var body = i>=0 ? md.slice(i+11) : md;
  var out=[];
  body.split('\n').forEach(function(line){
    var m=line.match(/^\s*-\s*(?:\[([^\]]*)\]\s*)?\*\*([^:*]+):\*\*\s*(.*)$/);
    if(m){ out.push({when:m[1]||'',name:m[2].trim(),text:m[3].trim()}); }
  });
  return out;
}
function gate(msgs){
  // light a chip green if that member's latest message carries their sign-off word
  var sign={akashi:/\bSAFE\b/i, mikoto:/MISSING:?\s*0/i, hugo:/\bGREEN\b/i};
  var latest={};
  msgs.forEach(function(m){ var k=who(m.name); if(sign[k]) latest[k]=m.text; });
  Object.keys(sign).forEach(function(k){
    var el=document.getElementById('c-'+k);
    if(latest[k] && sign[k].test(latest[k])) el.className='chip ok '+k;
    else el.className='chip';
  });
}
function render(msgs){
  feed.innerHTML='';
  if(!msgs.length){feed.innerHTML='<div class="sys">No messages yet. The team is quiet… 🌙</div>';return;}
  msgs.forEach(function(m){
    var cls=who(m.name), d=document.createElement('div');
    d.className='msg '+cls;
    if(cls==='sys'){ d.className='sys'; d.innerHTML=fmt(m.name+': '+m.text); feed.appendChild(d); return; }
    d.innerHTML='<div class="who">'+esc(m.name)+'</div>'+
      '<div class="bubble">'+fmt(m.text)+(m.when?'<div class="when">'+esc(m.when)+'</div>':'')+'</div>';
    feed.appendChild(d);
  });
  gate(msgs);
  document.getElementById('count').textContent=msgs.length+' messages';
  feed.scrollTop=feed.scrollHeight;
}
function tick(){
  fetch(RAW+'?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok)throw new Error(r.status); return r.text(); })
    .then(function(md){
      document.getElementById('status').textContent='updated '+new Date().toLocaleTimeString();
      document.getElementById('liveTxt').textContent='live';
      var h=md.length+':'+md.slice(-80);
      if(h!==lastHash){ lastHash=h; render(parse(md)); }
    })
    .catch(function(e){
      document.getElementById('liveTxt').textContent='reconnecting';
      document.getElementById('status').textContent='waiting for the room… ('+e.message+')';
    });
}
tick(); setInterval(tick,POLL);
</script>
</body>
</html>
